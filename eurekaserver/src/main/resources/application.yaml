server:
  port: 8761

spring:
  application:
    name: "eurekaserver"

  config:
    import: "optional:configserver:http://localhost:8072/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true



