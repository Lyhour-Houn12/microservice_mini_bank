server:
  port: 8080

spring:
  application:
    name: "accounts"

  datasource:
#    url: jdbc:postgresql://localhost:5435/accounts # ON LOCALHOST, USE PORT 5435 FOR ACCOUNTS DATABASE
    url: jdbc:postgresql://accounts-db:5432/accounts # ON DOCKER, USE PORT 5432 FOR ACCOUNTS DATABASE
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8072/"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true




management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - java.lang.NullPointerException
  ratelimiter:
    configs:
      default:
        timeout-duration: 1000
        limit-refresh-period: 5000
        limit-for-period: 1

info:
  app:
    name: "accounts"
    description: "Eazy Bank Account For Application"
    version: "1.0.0"

logging:
  level:
    com:
      jing:
        accounts: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"