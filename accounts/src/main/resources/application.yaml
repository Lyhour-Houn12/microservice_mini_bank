server:
  port: 8080

spring:
  application:
    name: "accounts"

  datasource:
    url: jdbc:postgresql://accounts-db:5432/accounts
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8072/"


#  By initial spring already know this properties
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest



management:
  endpoints:
    web:
      exposure:
        include: "*"
