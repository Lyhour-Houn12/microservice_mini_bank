server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:account
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"
  profiles:
    active: "qa"


build:
  version: "3.0"

accounts:
  message: "Welcome to EazyBank accounts related local APIs"
  contactDetails:
    name: "Jond Doe - Developer"
    email: "john@gmail.com"
  onCallSupport:
    -(555) 555-1234
    -(555) 555-1235