services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yaml
      service: network-deploy-services

  configserver:
    image: "lyhour121/configserver:s4"
    container_name: configserver-ms
    ports:
      - "8072:8072"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8072/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yaml
      service: microserivce-base-config

#      DB


  accountsdb:
    extends:
      file: common-config.yaml
      service: microserivce-db-congig
    container_name: accounts-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: "accounts"
    volumes:
      - accounts_data:/var/lib/postgresql/data
  cardsdb:
    extends:
      file: common-config.yaml
      service: microserivce-db-congig
    container_name: cards-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "cards"
    volumes:
      - cards_data:/var/lib/postgresql/data

  loansdb:
    extends:
      file: common-config.yaml
      service: microserivce-db-congig
    container_name: loans-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: "loans"
    volumes:
      - loans_data:/var/lib/postgresql/data

  accounts:
    image: "lyhour121/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: accounts
    extends:
      file: common-config.yaml
      service: microservice-configserver-config


  cards:
    image: "lyhour121/cards:s4"
    container_name: cards-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: cards
    extends:
      file: common-config.yaml
      service: microservice-configserver-config


  loans:
    image: "lyhour121/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: loans
    extends:
      file: common-config.yaml
      service: microservice-configserver-config


networks:
  eazybank:
    driver: "bridge"
volumes:
  accounts_data:
  cards_data:
  loans_data: