server:
  port: 8070
spring:
    application:
      name: "cards"
    profiles:
      active: "qa"
    datasource:
      url: jdbc:postgresql://cards-db:5432/cards
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres

    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update
      show-sql: true
    config:
      import: "optional:configserver:http://localhost:8072/"

management:
  endpoints:
    web:
      exposure:
        include: "*"




