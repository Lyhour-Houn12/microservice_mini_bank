server:
  port: 8070
spring:
    application:
      name: "cards"
    profiles:
      active: "qa"
    datasource:
#      url: jdbc:postgresql://localhost:5433/cards
      url: jdbc:postgresql://cards-db:5432/cards
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres

    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update
      show-sql: true
    config:
      import: "optional:configserver:http://localhost:8072/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}


eureka:
  instance:
    ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

info:
  app:
    name: "cards"
    description: "Eazy Bank Cards For Applications"
    version: "1.0.0"


logging:
  level:
    com:
      jing:
        cards: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"



