server:
  port: 8090

spring:
  application:
    name: "loans"
  datasource:
    url: jdbc:postgresql://loans-db:5432/loans
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8072/"


management:
  endpoints:
    web:
      exposure:
        include: "*"