spring:
  application:
    name: gatewayserver

  config:
    import: "optional:configserver:http://localhost:8072"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "gateway"
    description: "Eazy Bank API Gateway For Application"
    version: "1.0.0"

logging:
  level:
    com:
      jing:
        gatewayserver: DEBUG